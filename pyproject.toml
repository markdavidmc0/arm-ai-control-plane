[project]
name = "arm-federated-ai-workspace"
version = "0.1.0"
description = "Root workspace for Arm Federated AI platform"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
    "src/control_plane",
    "src/data_plane",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, variables)
    "I",   # isort (import sorting)
    "N",   # pep8-naming
    "D",   # pydocstyle (enforces docstrings)
    "UP",  # pyupgrade (modernizes python syntax)
]
ignore = [
    "D100",  # Missing docstring in public module
    "D104",  # Missing docstring in public package (__init__.py)
    "D107",  # Missing docstring in __init__
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false

[tool.pytest.ini_options]
pythonpath = ["src/control_plane", "src/data_plane", "."]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

markers = [
    # --- Existing Infrastructure & Execution Markers ---
    "smoke: Fast execution (<10s) gateway readiness and RPC checks.",
    "kind: Marks tests requiring a live KinD Kubernetes cluster",
    "live_cluster: Integration tests targeting live GKE or local Kubernetes clusters via port-forwarding",
    "heavy: Marks slow, multi-turn agent benchmark scenarios",

    # --- Structural Hierarchy Markers ---
    "unit: Fast isolated unit tests (no network or external services)",
    "contract: Plane boundary and protocol contract tests",
    "integration: Cross-module contract and in-memory routing tests",
    "e2e: End-to-end full deployment tests",
    "benchmark: Performance, token, and latency benchmark suite",
]

# Prevent accidental execution of slow cluster/heavy tests during plain `uv run pytest`
addopts = "-m 'not heavy and not kind and not live_cluster'"
