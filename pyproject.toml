[project]
name = "arm-federated-ai"
version = "1.0.0"
description = "GKE-sandboxed Mobile AI cross-compilation workloads platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "mcp>=1.28.1",
    "fastmcp>=3.4.4",
    "logfire[system-metrics]>=4.39.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, variables)
    "I",   # isort (import sorting)
    "N",   # pep8-naming
    "D",   # pydocstyle (enforces docstrings)
    "UP",  # pyupgrade (modernizes python syntax)
]
ignore = [
    "D100",  # Missing docstring in public module (we can skip top-of-file boilerplate)
    "D104",  # Missing docstring in public package (__init__.py)
    "D107",  # Missing docstring in __init__ (covered by class level docstrings)
]

[tool.ruff.lint.pydocstyle]
convention = "google" # Enforce Google-style docstrings exclusively

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false

[tool.pytest.ini_options]
pythonpath = ["."]   # Automatically makes 'src' accessible to all tests
testpaths = ["tests"] # Restricts test scanning only to the tests folder

