apiVersion: apps/v1
kind: Deployment
metadata:
  name: mvcp-control-plane
  labels:
    app: mvcp-control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mvcp-control-plane
  template:
    metadata:
      labels:
        app: mvcp-control-plane
    spec:
      # Enable sandboxed execution within gVisor on Arm64 Tau T2A nodes
      runtimeClassName: gvisor
      nodeSelector:
        kubernetes.io/arch: arm64
      tolerations:
      - key: "sandbox.gke.io/runtime"
        operator: "Equal"
        value: "gvisor"
        effect: "NoSchedule"
      - key: "kubernetes.io/arch"
        operator: "Equal"
        value: "arm64"
        effect: "NoSchedule"
      
      containers:
      # Container 1: FastAPI Control Plane Backend
      - name: control-plane
        image: gcr.io/sovereign-ai-495715/control-plane-backend:latest
        imagePullPolicy: Always
        command: ["uvicorn", "src.control_plane.main:app", "--host", "0.0.0.0", "--port", "8000"]
        ports:
        - containerPort: 8000
          name: fastapi-port
        env:
        # Cryptographic Identity via Tailscale network mesh key injection
        - name: TS_AUTHKEY
          valueFrom:
            secretKeyRef:
              name: tailscale-secret
              key: TS_AUTHKEY
        - name: KUBERNETES_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: SANDBOX_IMAGE
          value: gcr.io/sovereign-ai-495715/mobile-ndk-kleidiai:latest
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "1Gi"

      # Container 2: Envoy Proxy AI Gateway Sidecar
      - name: envoy-gateway
        image: envoyproxy/envoy:v1.28.0
        imagePullPolicy: IfNotPresent
        command: ["/usr/local/bin/envoy", "-c", "/etc/envoy/envoy.yaml"]
        ports:
        - containerPort: 10000
          name: envoy-port
        volumeMounts:
        - name: envoy-config-volume
          mountPath: /etc/envoy
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

      volumes:
      - name: envoy-config-volume
        configMap:
          name: mvcp-envoy-config
