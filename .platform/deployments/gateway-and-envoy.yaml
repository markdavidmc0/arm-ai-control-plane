apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-config
  namespace: default
data:
  envoy.yaml: |
    static_resources:
      listeners:
      - name: ingress_listener
        address:
          socket_address:
            address: 0.0.0.0
            port_value: 10000
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: ingress_http
              route_config:
                name: local_route
                virtual_hosts:
                - name: backend
                  domains: ["*"]
                  routes:
                  - match:
                      prefix: "/"
                    route:
                      cluster: gateway_service
              http_filters:
              - name: envoy.filters.http.ext_authz
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                  http_service:
                    server_uri:
                      cluster: gateway_service
                      timeout: 0.25s
                      uri: http://mvcp-gateway-service:8000/api/v1/internal/auth-check
                    authorization_request:
                      allowed_headers:
                        patterns:
                        - exact: authorization
                        - exact: x-judge-api-key
                        - exact: x-workspace-context
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
      - name: gateway_service
        type: LOGICAL_DNS
        dns_lookup_family: V4_ONLY
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: gateway_service
          endpoints:
          - lb_endpoints:
            - endpoint:
                socket_address:
                  address: mvcp-gateway-service
                  port_value: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mvcp-gateway-deployment
  namespace: default
  labels:
    app: mvcp-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mvcp-gateway
  template:
    metadata:
      labels:
        app: mvcp-gateway
    spec:
      tolerations:
      - key: "kubernetes.io/arch"
        operator: "Equal"
        value: "arm64"
        effect: "NoSchedule"
      containers:
      - name: control-plane-gateway
        image: gcr.io/sovereign-ai-495715/mvcp-gateway:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: PORT
          value: "8000"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "1000m"
            memory: "1024Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: mvcp-gateway-service
  namespace: default
spec:
  selector:
    app: mvcp-gateway
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy-edge-guard-deployment
  namespace: default
  labels:
    app: envoy-edge-guard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: envoy-edge-guard
  template:
    metadata:
      labels:
        app: envoy-edge-guard
    spec:
      tolerations:
      - key: "kubernetes.io/arch"
        operator: "Equal"
        value: "arm64"
        effect: "NoSchedule"
      containers:
      - name: envoy-proxy
        image: envoyproxy/envoy:v1.28.0
        ports:
        - containerPort: 10000
        volumeMounts:
        - name: envoy-config-volume
          mountPath: /etc/envoy
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
      volumes:
      - name: envoy-config-volume
        configMap:
          name: envoy-config
---
apiVersion: v1
kind: Service
metadata:
  name: envoy-edge-guard-service
  namespace: default
spec:
  type: LoadBalancer
  selector:
    app: envoy-edge-guard
  ports:
  - protocol: TCP
    port: 10000
    targetPort: 10000
