# --- Official Arm MCP + KleidiAI Server Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: official-arm-mcp-deployment
  namespace: default
  labels:
    app: official-arm-mcp
    mvcp.ai/server-type: base
spec:
  replicas: 1
  selector:
    matchLabels:
      app: official-arm-mcp
  template:
    metadata:
      labels:
        app: official-arm-mcp
        mvcp.ai/server-type: base
    spec:
      tolerations:
      - operator: "Exists"
      containers:
      - name: official-arm-mcp-server
        image: gcr.io/sovereign-ai-495715/official-arm-mcp:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: PORT
          value: "8000"
        - name: ENABLE_KLEIDIAI
          value: "true"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "1000m"
            memory: "1024Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: official-arm-mcp-service
  namespace: default
spec:
  selector:
    app: official-arm-mcp
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000

