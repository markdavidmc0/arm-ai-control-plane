apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm-config
  namespace: default
data:
  keycloak-realm-stub.json: |
    {
      "realm": "arm-platform",
      "enabled": true,
      "displayName": "Arm Platform OAuth 2.0 / OIDC M2M Realm",
      "accessTokenLifespan": 900,
      "roles": {
        "realm": [
          {
            "name": "mcp-registrar",
            "description": "Permission to register tools and servers into Master MCP Registry"
          }
        ]
      },
      "clientScopes": [
        {
          "name": "tools:register",
          "protocol": "openid-connect"
        }
      ],
      "clients": [
        {
          "clientId": "github-ci-runner",
          "name": "GitHub Actions M2M CI/CD Runner Client",
          "secret": "mcp_ci_runner_secret_2026",
          "serviceAccountsEnabled": true,
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": true,
          "clientAuthenticatorType": "client-secret",
          "protocol": "openid-connect",
          "defaultClientScopes": [
            "web-origins",
            "roles",
            "profile",
            "tools:register"
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak-deployment
  namespace: default
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:24.0.0
        args: ["start-dev", "--import-realm"]
        env:
        - name: KEYCLOAK_ADMIN
          value: "admin"
        - name: KEYCLOAK_ADMIN_PASSWORD
          value: "admin123"
        - name: KC_HTTP_PORT
          value: "8080"
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: realm-config-volume
          mountPath: /opt/keycloak/data/import
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1024Mi"
      volumes:
      - name: realm-config-volume
        configMap:
          name: keycloak-realm-config
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-service
  namespace: default
spec:
  selector:
    app: keycloak
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
