apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm-config
  namespace: default
data:
  keycloak-realm-stub.json: |
    {
      "realm": "arm-platform",
      "enabled": true,
      "displayName": "Arm Platform OAuth 2.0 / OIDC M2M Realm",
      "accessTokenLifespan": 300,
      "roles": {
        "realm": [
          {
            "name": "mcp-registrar",
            "description": "Permission to register tools and servers into Master MCP Registry"
          }
        ]
      },
      "clientScopes": [
        {
          "name": "tools:register",
          "protocol": "openid-connect"
        }
      ],
      "clients": [
        {
          "clientId": "github-ci-runner",
          "name": "GitHub Actions Direct OIDC M2M Client",
          "serviceAccountsEnabled": true,
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "clientAuthenticatorType": "client-jwt",
          "protocol": "openid-connect",
          "attributes": {
            "use.jwks.url": "true",
            "jwks.url": "https://token.actions.githubusercontent.com/.well-known/jwks.json",
            "token.endpoint.auth.signing.alg": "RS256"
          },
          "defaultClientScopes": [
            "web-origins",
            "roles",
            "profile",
            "tools:register"
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak-deployment
  namespace: default
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      tolerations:
      - key: "kubernetes.io/arch"
        operator: "Equal"
        value: "arm64"
        effect: "NoSchedule"
      - key: "sandbox.gke.io/runtime"
        operator: "Equal"
        value: "gvisor"
        effect: "NoSchedule"
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:24.0.0
        args: ["start-dev", "--import-realm"]
        env:
        - name: KEYCLOAK_ADMIN
          value: "admin"
        - name: KEYCLOAK_ADMIN_PASSWORD
          value: "admin123"
        - name: KC_HTTP_PORT
          value: "8080"
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: realm-config-volume
          mountPath: /opt/keycloak/data/import
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1024Mi"
      volumes:
      - name: realm-config-volume
        configMap:
          name: keycloak-realm-config
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-service
  namespace: default
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: NodePort
  selector:
    app: keycloak
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
