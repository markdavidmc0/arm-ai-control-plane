name: Platform E2E Heavy Benchmarks

on:
  schedule:
    - cron: '0 2 * * *' # Nightly at 02:00 UTC
  workflow_dispatch:
  pull_request:
    types: [labeled]

jobs:
  heavy-e2e-benchmark:
    name: Run Heavy Agent Benchmarks (KinD)
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-benchmarks'))
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write' # Required for requesting OIDC JWT token from GitHub

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv Package Manager
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Authenticate to Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/389363417412/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider'
          service_account: 'mvcp-github-ci-sa@sovereign-ai-495715.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry & Prepare Images
        run: |
          gcloud auth configure-docker gcr.io --quiet
          docker build -t gcr.io/sovereign-ai-495715/mvcp-gateway:latest .
          docker pull gcr.io/sovereign-ai-495715/official-arm-mcp:v1.0.0 || true
          docker pull gcr.io/sovereign-ai-495715/performix-mcp:v1.0.0 || true
          docker pull gcr.io/sovereign-ai-495715/arm-metis-mcp:v1.0.0 || true

      - name: Create multi-node-pool kind Kubernetes Cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: kind-e2e-cluster
          config: .platform/deployments/kind-config.yaml

      - name: Load Pre-Pulled Images into KinD Cluster
        run: |
          kind load docker-image gcr.io/sovereign-ai-495715/mvcp-gateway:latest --name kind-e2e-cluster
          kind load docker-image gcr.io/sovereign-ai-495715/official-arm-mcp:v1.0.0 --name kind-e2e-cluster || true
          kind load docker-image gcr.io/sovereign-ai-495715/performix-mcp:v1.0.0 --name kind-e2e-cluster || true
          kind load docker-image gcr.io/sovereign-ai-495715/arm-metis-mcp:v1.0.0 --name kind-e2e-cluster || true

      - name: Apply Platform Kubernetes & Envoy Manifests
        run: |
          kubectl wait --for=condition=Ready nodes --all --timeout=60s
          kubectl apply -f .platform/deployments/gateway-and-envoy.yaml
          kubectl apply -f .platform/deployments/in-house-mcp-servers.yaml
          kubectl rollout status deployment/mvcp-gateway-deployment --timeout=180s

      - name: Run Heavy E2E Agent Benchmarks
        env:
          E2E_TARGET: kind
          GATEWAY_BASE_URL: http://localhost:8080
        run: |
          uv sync
          uv run pytest tests/e2e/test_scenarios.py -v -m "heavy"

      - name: Stream Pod Logs & Describe Cluster Status on Failure
        if: failure()
        run: |
          echo "=== 1. ALL POD STATUSES ==="
          kubectl get pods -A -o wide

          echo "=== 2. DESCRIBE FAILED/PENDING PODS ==="
          kubectl describe pods -n default

          echo "=== 3. GATEWAY CONTAINER LOGS ==="
          kubectl logs -n default -l app=mvcp-gateway --all-containers=true --tail=200 || true

          echo "=== 4. ENVOY EDGE GUARD LOGS ==="
          kubectl logs -n default -l app=envoy-edge-guard --all-containers=true --tail=200 || true

