name: Platform Control Plane CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-validate:
    name: Pytest Unit Tests & Schema Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv Package Manager
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Run Pytest Test Suite
        run: |
          uv sync
          uv run pytest

  build-and-deploy:
    name: Build Container Images & Trigger Kubernetes Rolling Update
    needs: test-and-validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write' # Required for requesting OIDC JWT token from GitHub

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/389363417412/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider'
          service_account: 'mvcp-github-ci-sa@sovereign-ai-495715.iam.gserviceaccount.com'

      - name: Set up Cloud SDK & GKE Auth Plugin
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: 'gke-gcloud-auth-plugin'

      - name: Set up QEMU for Arm64 Emulation
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx (Cache Optimization)
        uses: docker/setup-buildx-action@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Build & Push Arm64 Control Plane Gateway Image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            gcr.io/sovereign-ai-495715/mvcp-gateway:${{ github.sha }}
            gcr.io/sovereign-ai-495715/mvcp-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Get GKE Cluster Credentials
        run: |
          gcloud container clusters get-credentials mvcp-gke-cluster \
            --zone us-central1-a \
            --project sovereign-ai-495715

      - name: Apply Kubernetes Rolling Update (Zero Downtime)
        run: |
          kubectl apply -f .platform/deployments/coredns-custom.yaml
          kubectl apply -f .platform/deployments/keycloak.yaml
          kubectl apply -f .platform/deployments/gateway-and-envoy.yaml
          kubectl apply -f .platform/deployments/in-house-mcp-servers.yaml
          kubectl apply -f .platform/deployments/ingress.yaml
          kubectl set image deployment/mvcp-gateway-deployment control-plane-gateway=gcr.io/sovereign-ai-495715/mvcp-gateway:${{ github.sha }}
          kubectl rollout status deployment/mvcp-gateway-deployment --timeout=300s
