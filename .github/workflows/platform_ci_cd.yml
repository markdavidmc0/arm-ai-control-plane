name: Platform Core CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-validate:
    name: Linting & Unit Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv and Set Up Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: '3.12'

      - name: Run Ruff Linter
        run: |
          uv sync --all-packages
          uv run ruff check .

      - name: Run Pytest Test Suite
        env:
          GATEWAY_BASE_URL: "in-memory"
        run: |
          uv run pytest -m "smoke or (not heavy and not kind)"

  build-and-push:
    name: Build & Push (${{ matrix.service.name }})
    needs: [test-and-validate]
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    # Use native Arm64 runners for fast container compilation without QEMU overhead
    runs-on: ubuntu-24.04-arm

    strategy:
      matrix:
        service:
          - name: control-plane
            context: src/control_plane
            dockerfile: src/control_plane/docker/Dockerfile
            image: us-central1-docker.pkg.dev/sovereign-ai-495715/mvcp/arm-control-plane
          - name: data-plane
            context: src/data_plane
            dockerfile: src/data_plane/docker/Dockerfile
            image: us-central1-docker.pkg.dev/sovereign-ai-495715/mvcp/arm-data-plane-worker

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/389363417412/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider'
          service_account: 'mvcp-github-ci-sa@sovereign-ai-495715.iam.gserviceaccount.com'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build & Push Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          platforms: linux/arm64
          push: true
          tags: |
            ${{ matrix.service.image }}:${{ github.ref_name }}
            ${{ matrix.service.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-gke:
    name: Rolling Update to GKE
    needs: [build-and-push]
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/389363417412/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider'
          service_account: 'mvcp-github-ci-sa@sovereign-ai-495715.iam.gserviceaccount.com'

      - name: Set up Cloud SDK & GKE Auth Plugin
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: 'gke-gcloud-auth-plugin'

      - name: Get GKE Cluster Credentials
        run: |
          gcloud container clusters get-credentials mvcp-gke-cluster \
            --zone us-central1-a \
            --project sovereign-ai-495715

      - name: Apply Core Platform Infrastructure & Updates
        run: |
          # 1. Apply platform runtime classes, CoreDNS, and shared ingress
          kubectl apply -f infra/deployments/shared/

          # 2. Apply Control Plane components (Keycloak, API gateway)
          kubectl apply -f infra/deployments/control_plane/

          # 3. Apply Data Plane worker nodes and agent execution resources
          kubectl apply -f infra/deployments/data_plane/

          # Update container images to the ref/tag release build
          kubectl set image deployment/control-plane-deployment control-plane=us-central1-docker.pkg.dev/sovereign-ai-495715/mvcp/arm-control-plane:${{ github.ref_name }}
          kubectl set image deployment/data-plane-worker-deployment data-plane-worker=us-central1-docker.pkg.dev/sovereign-ai-495715/mvcp/arm-data-plane-worker:${{ github.ref_name }}

          # Verify deployment rollouts
          kubectl rollout status deployment/control-plane-deployment --timeout=300s
          kubectl rollout status deployment/data-plane-worker-deployment --timeout=300s
