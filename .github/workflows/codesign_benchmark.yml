name: Arm Co-Design KPI Benchmark CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-benchmark:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Monorepo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install grpcio grpcio-tools

    - name: Set up Bazel
      uses: bazelbuild/setup-bazel@v3
      with:
        bazel-version: 7.4.1

    - name: Compile C++ FVP Client with Bazel
      run: |
        bazel build //components/runtime:fvp_runtime

    - name: Execute Multi-Component Co-Design Benchmark
      run: |
        python3 run_benchmark.py
