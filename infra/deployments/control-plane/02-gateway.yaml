apiVersion: v1
kind: ServiceAccount
metadata:
  name: mvcp-gateway-sa
  namespace: default
  annotations:
    iam.gke.io/gcp-service-account: mvcp-gateway-gsa@sovereign-ai-495715.iam.gserviceaccount.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane-deployment
  namespace: default
  labels:
    app: mvcp-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mvcp-gateway
  template:
    metadata:
      labels:
        app: mvcp-gateway
    spec:
      serviceAccountName: mvcp-gateway-sa
      nodeSelector:
        kubernetes.io/arch: arm64
      tolerations:
      - key: "kubernetes.io/arch"
        operator: "Equal"
        value: "arm64"
        effect: "NoSchedule"
      containers:
      - name: control-plane
        image: us-central1-docker.pkg.dev/sovereign-ai-495715/mvcp/arm-control-plane:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: PORT
          value: "8000"
        - name: ALLOW_NATIVE_BENCHMARKS
          value: "true"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "1000m"
            memory: "1024Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: mvcp-gateway-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: mvcp-gateway
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
    nodePort: 30080
