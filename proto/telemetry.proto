syntax = "proto3";

package telemetry;

// The central orchestrator service for hardware/software co-design.
service TelemetryOrchestrator {
  // Routes a workload to the ideal execution hardware based on metrics and target profiles.
  rpc RouteWorkload (WorkloadPayload) returns (RouteDecision);

  // Analyzes hardware telemetry from FVP runs to recommend architectural/compilation parameters.
  rpc AnalyzeHardwareTelemetry (HardwareMetrics) returns (OptimizationFeedback);
}

// Payload describing the workload characteristics.
message WorkloadPayload {
  string id = 1;
  string shape = 2;         // e.g. "1024x1024", "256x256"
  string precision = 3;     // e.g. "INT8", "FP32", "FP16"
  string target_profile = 4; // e.g. "cloud_ai", "mobile_ai", "physical_ai"
}

// Decided routing path for the workload.
message RouteDecision {
  string selected_path = 1; // e.g. "NEON_BLAS", "SVE_VECTOR", "SME_MATRIX"
}

// Telemetry statistics captured during execution on target/FVP hardware.
message HardwareMetrics {
  uint64 cycles = 1;
  uint64 cache_misses = 2;
  double sve_sme_utilization = 3; // e.g., 0.15 (15% execution unit saturation)
  string target_profile = 4;      // Contextual deployment profile
}

// Recommended compiler and hardware optimization parameters.
message OptimizationFeedback {
  bool loop_unrolling = 1;         // Recommend unrolling critical loops
  int32 vector_register_width = 2; // Recommended vector register size (128, 256, 512 bits)
}
